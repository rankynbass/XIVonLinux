name: Build

on:
  push:
    tags:
      - "v[0-9]*.[0-9]*.[0-9]*"
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-24.04
    permissions:
      contents: write   # softprops/action-gh-release creates releases with GITHUB_TOKEN
    steps:
      - uses: actions/checkout@v4
        with:
          # GetGitHash runs `git describe --long --always --dirty` from the project dir:
          # needs full history and tags, and the FFXIVQuickLauncher submodule must be present.
          submodules: recursive
          fetch-depth: 0

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"

      - name: Publish single-file linux-x64 build
        run: dotnet publish src/XIVonLinux/XIVonLinux.csproj -c Release -r linux-x64

      - name: Package publish dir
        run: tar -C src/XIVonLinux/bin/Release/net10.0/linux-x64/publish -czf XIVonLinux-${{ github.ref_name }}-linux-x64.tar.gz .

      - name: Attach to release (tag pushes)
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: XIVonLinux-${{ github.ref_name }}-linux-x64.tar.gz

      - name: Upload artifact (manual runs get no release)
        if: github.event_name == 'workflow_dispatch'
        uses: actions/upload-artifact@v4
        with:
          name: XIVonLinux-linux-x64
          path: XIVonLinux-${{ github.ref_name }}-linux-x64.tar.gz
          if-no-files-found: error
